# pytest 설정 파일
[pytest]
# 테스트 파일은 tests 폴더에서 찾는다.
testpaths = tests
# 프로젝트 폴더(/workspace)를 import 경로에 넣는다. → `from app.main import app` 이 된다.
pythonpath = .
# 캐시 폴더(.pytest_cache)를 만들지 않는다. (윈도우 폴더에 불필요한 파일이 쌓이지 않게)
addopts = -p no:cacheprovider
# 우리 코드와 상관없는 라이브러리 내부 안내문은 숨긴다. (결과 화면을 읽기 쉽게)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
