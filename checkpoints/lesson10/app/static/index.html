<!DOCTYPE html>
<!--
  index.html - 메모장 화면 (10교시)

  이 파일이 보여 주는 개념
    1) HTML 은 화면의 "뼈대"만 만든다. (입력 칸, 버튼, 목록 자리)
    2) 실제 데이터는 app.js 가 API(/memos)를 불러서 채운다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메모장</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>메모장</h1>

    <!-- 메모를 쓰는 폼. 수정할 때도 이 폼을 다시 쓴다. -->
    <form id="memo-form">
      <input id="title" type="text" placeholder="제목 (필수, 100자까지)" maxlength="100" required>
      <textarea id="content" placeholder="내용 (1000자까지)" maxlength="1000" rows="3"></textarea>
      <div class="buttons">
        <button id="save-button" type="submit">저장</button>
        <button id="cancel-button" type="button" hidden>수정 취소</button>
      </div>
    </form>

    <!-- 오류나 안내 문구가 나오는 자리 -->
    <p id="message" role="status"></p>

    <!-- 메모 목록이 들어가는 자리. app.js 가 채운다. -->
    <ul id="memo-list"></ul>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
