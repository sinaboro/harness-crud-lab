# ============================================================
# docker-compose.volume.yml - DB 데이터 저장 방식의 "예비 설정"
#
# 기본 설정(docker-compose.yml)은 DB 데이터를 C 드라이브 폴더(data\postgres)에 둔다.
# 일부 PC 에서는 윈도우 폴더의 권한 문제로 PostgreSQL 이 켜지지 않을 수 있다.
# (docker compose logs db 에 "Operation not permitted", "wrong ownership" 같은 문구가 보일 때)
#
# 그럴 때만 이 파일을 함께 써서 Docker 가 관리하는 저장 공간(이름 있는 볼륨)으로 바꾼다.
#
#   docker compose -f docker-compose.yml -f docker-compose.volume.yml up -d --build
#
# 자세한 설명: docs/troubleshooting.md
# ============================================================

services:
  db:
    volumes: !override
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
